# ============================================================
#  VlashLink - Minecraft <-> Discord account linking
#  By Vlash
# ============================================================
#  Save this file as UTF-8. Restart the proxy after editing.

# Discord bot token (Discord Developer Portal -> your app -> Bot -> Reset Token)
bot-token=PUT_YOUR_BOT_TOKEN_HERE

# Your Discord server (guild) ID. Enable Developer Mode in Discord, right-click the
# server icon -> Copy Server ID. Can be left empty if the bot is in only ONE server.
guild-id=

# Minutes before a link code expires
code-expire-minutes=5

# ------------------------------------------------------------
#  Discord messages (Markdown supported)
#  Placeholders: {code} {expires} {player}
# ------------------------------------------------------------
discord.panel.title=🔗 ربط حسابك بماين كرافت
discord.panel.description=دوس على الزر اللي تحت علشان تاخد كود الربط.\nبعدها ادخل السيرفر واكتب في الشات:\n`/link الكود`
discord.panel.button=🔗 احصل على الكود
discord.panel.sent=✅ تم إرسال لوحة الربط في الروم.
discord.panel.failed=❌ معرفتش أبعت الرسالة هنا. اتأكد إن البوت عنده صلاحيات View Channel و Send Messages و Embed Links في الروم دي.
discord.code=✅ **كود الربط بتاعك:**\n```{code}```\nادخل ماين كرافت واكتب:\n`/link {code}`\n⏳ الكود هينتهي {expires}
discord.already-linked=⚠️ حسابك مربوط بالفعل باللاعب **{player}**.\nلو عايز تفك الربط اكتب `/unlink` جوه اللعبة.

# ------------------------------------------------------------
#  In-game messages (MiniMessage format)
#  Note: Minecraft's default font doesn't render Arabic correctly,
#  so the in-game defaults are English.
#  Placeholders: {player}
# ------------------------------------------------------------
game.prefix=<dark_gray>[<aqua>VlashLink<dark_gray>] <reset>
game.only-players=<red>This command can only be used by players.
game.usage=<yellow>Usage: <white>/link [code]</white> <gray>(click the button in the Discord channel to get your code)
game.invalid-code=<red>Invalid or expired code. Click the button in Discord to get a new one.
game.already-linked=<red>Your account is already linked. Use <white>/unlink</white> first if you want to link again.
game.discord-already-linked=<red>That Discord account is already linked to another player.
game.link-success=<green>Your account has been linked to Discord successfully!
game.nickname-updated=<gray>Your Discord nickname is now <white>{player}</white>.
game.nickname-failed=<yellow>Linked, but I couldn't change your Discord nickname. The bot needs the "Manage Nicknames" permission and a role above yours (the server owner's nickname can't be changed by bots).
game.unlink-success=<green>Your account has been unlinked from Discord.
game.not-linked=<red>Your account isn't linked to any Discord account.
